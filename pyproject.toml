[project]
name = "energy-load-forecast"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "izvoranumarius", email = "izvoranumariusgabriel@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "darts[torch]>=0.47.0",
    "entsoe-py>=0.8.1",
    "lightgbm>=4.7.0",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "tabulate>=0.10.0",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "torchvision>=0.29.1",
    "truststore>=0.10.4",
]

[project.scripts]
energy-load-forecast = "energy_load_forecast:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"

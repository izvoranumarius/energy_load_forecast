[project]
name = "energy-load-forecast"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "izvoranumarius", email = "izvoranumariusgabriel@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "entsoe-py>=0.8.1",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
energy-load-forecast = "energy_load_forecast:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
